<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <radialGradient id="bgBase" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#171636"/>
      <stop offset="55%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#060711"/>
    </radialGradient>

    <radialGradient id="glowLime" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.48"/>
      <stop offset="42%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowMagenta" cx="24%" cy="68%" r="52%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.46"/>
      <stop offset="48%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="78%" cy="64%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="22%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a3e635" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="wordGlow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep vivid aurora backdrop -->
  <rect width="1024" height="1024" fill="url(#bgBase)"/>
  <rect width="1024" height="1024" fill="url(#glowMagenta)"/>
  <rect width="1024" height="1024" fill="url(#glowCyan)"/>
  <rect width="1024" height="1024" fill="url(#glowLime)"/>

  <!-- Playful concentric rhythm rings -->
  <g opacity="0.72">
    <circle cx="512" cy="492" r="420" stroke="url(#ringGrad2)" stroke-width="2.5" stroke-dasharray="14 18"/>
    <circle cx="512" cy="492" r="356" stroke="url(#ringGrad1)" stroke-width="4" stroke-dasharray="90 22 24 22"/>
    <circle cx="512" cy="492" r="296" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <!-- Ambient luminous sparks -->
  <g>
    <circle cx="232" cy="280" r="7" fill="#bef264" opacity="0.8"/>
    <circle cx="258" cy="242" r="3.5" fill="#22d3ee" opacity="0.75"/>
    <circle cx="792" cy="296" r="8" fill="#22d3ee" opacity="0.78"/>
    <circle cx="758" cy="252" r="4" fill="#ec4899" opacity="0.8"/>
    <circle cx="212" cy="680" r="6" fill="#f472b6" opacity="0.72"/>
    <circle cx="814" cy="662" r="6.5" fill="#a3e635" opacity="0.78"/>
    <circle cx="512" cy="144" r="5" fill="#a3e635" opacity="0.72"/>
    <circle cx="348" cy="836" r="4.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="688" cy="828" r="4.5" fill="#22d3ee" opacity="0.7"/>
  </g>

  <!-- Mini equalizer crest behind icon -->
  <g opacity="0.45">
    <rect x="278" y="388" width="12" height="52" rx="6" fill="#ec4899"/>
    <rect x="306" y="358" width="12" height="88" rx="6" fill="#a855f7"/>
    <rect x="334" y="374" width="12" height="68" rx="6" fill="#22d3ee"/>
    <rect x="678" y="372" width="12" height="70" rx="6" fill="#22d3ee"/>
    <rect x="706" y="354" width="12" height="92" rx="6" fill="#a3e635"/>
    <rect x="734" y="386" width="12" height="54" rx="6" fill="#ec4899"/>
  </g>

  <!-- Brand Icon Badge (exact proportions from header icon.svg) -->
  <g transform="translate(382, 238)" filter="url(#softGlow)">
    <rect width="260" height="260" rx="65" fill="#090D0B" stroke="url(#badgeBorder)" stroke-width="5"/>
    <g transform="scale(4.0625)">
      <rect x="13" y="22" width="7" height="22" rx="3.5" fill="#A3E635"/>
      <rect x="24" y="13" width="7" height="38" rx="3.5" fill="#84CC16"/>
      <rect x="35" y="19" width="7" height="26" rx="3.5" fill="#BEF264"/>
      <rect x="46" y="27" width="7" height="16" rx="3.5" fill="#4D7C0F"/>
      <circle cx="49.5" cy="18.5" r="3.5" fill="#A3E635"/>
    </g>
  </g>

  <!-- Signature yritmx Wordmark from Header -->
  <g transform="translate(222, 548) scale(0.33657)" filter="url(#wordGlow)">
    <path
      fill="#84FF00"
      fill-rule="nonzero"
      d="M-0 128.11l80.31 0 100.58 152.25 69.75 -152.25 80.12 0 -254.26 417.61 -17.82 1.26 90.38 -200.71 -149.05 -218.16zm1404.89 0l90.99 0 56.08 97.2 67.03 -97.2 89.72 0 -119.51 167.47 134.05 251.06 -14.71 0.31 -151.34 -208.95 -73.75 102.15 -89.72 0 118.41 -164.15 -107.24 -147.89z"
    />
    <path
      fill="#F5F7FA"
      fill-rule="nonzero"
      d="M357.49 128.11l67.58 0 0 39.67c7.25,-15.48 16.85,-27.23 28.79,-35.26 12.05,-8.03 25.17,-12.05 39.38,-12.05 10.09,0 20.67,2.64 31.73,8.03l-24.29 67.58c-9.11,-4.6 -16.65,-6.86 -22.53,-6.86 -11.95,0 -22.13,7.45 -30.36,22.34 -8.33,14.88 -12.44,44.07 -12.44,87.56l0.3 15.18 0 125.86 -78.16 0 0 -312.04zm237.22 -128.11c13.71,0 25.47,5 35.26,14.89 9.89,9.9 14.79,21.84 14.79,35.95 0,13.91 -4.9,25.76 -14.6,35.55 -9.7,9.8 -21.35,14.69 -34.97,14.69 -13.9,0 -25.76,-5 -35.55,-14.99 -9.89,-9.99 -14.79,-22.13 -14.79,-36.43 0,-13.72 4.9,-25.37 14.6,-35.06 9.7,-9.7 21.45,-14.6 35.26,-14.6zm-39.28 128.11l78.16 0 0 312.04 -78.16 0 0 -312.04zm158.47 -115.18l78.16 0 0 115.18 46.43 0 0 67.58 -46.43 0 0 244.46 -78.16 0 0 -244.46 -39.96 0 0 -67.58 39.96 0 0 -115.18zm166.21 115.18l78.16 0 0 36.43c13.42,-14.79 28.3,-25.85 44.76,-33.1 16.35,-7.35 34.27,-10.97 53.67,-10.97 19.5,0 37.22,4.8 52.89,14.4 15.77,9.6 28.41,23.7 38.01,42.12 12.44,-18.41 27.71,-32.52 45.84,-42.12 18.12,-9.59 38,-14.4 59.45,-14.4 22.23,0 41.83,5.19 58.67,15.48 16.94,10.28 28.99,23.8 36.43,40.35 7.34,16.64 11.07,43.68 11.07,81.1l0 182.76 -78.16 0 0 -157.69c0,-35.26 -4.41,-59.16 -13.32,-71.59 -8.91,-12.44 -22.34,-18.71 -40.06,-18.71 -13.61,0 -25.76,3.82 -36.43,11.46 -10.77,7.54 -18.8,18.12 -23.99,31.53 -5.19,13.42 -7.84,34.97 -7.84,64.74l0 140.25 -78.16 0 0 -150.54c0,-27.81 -2.05,-47.99 -6.27,-60.43 -4.12,-12.54 -10.38,-21.75 -18.61,-27.92 -8.33,-6.07 -18.41,-9.11 -30.16,-9.11 -13.13,0 -25.08,3.82 -35.75,11.56 -10.77,7.73 -18.71,18.51 -24.09,32.41 -5.29,13.91 -7.93,35.85 -7.93,65.72l0 138.3 -78.16 0 0 -312.04z"
    />
  </g>

  <!-- Flowing Neon Audio Wave Ribbon -->
  <path
    d="M 192 784 C 280 732, 344 824, 424 776 C 488 738, 536 824, 608 776 C 680 728, 744 822, 832 782"
    stroke="url(#waveGrad)"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 228 806 C 304 836, 368 754, 444 794 C 512 830, 560 752, 636 794 C 704 832, 756 764, 798 796"
    stroke="url(#waveGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.7"
  />
</svg>
